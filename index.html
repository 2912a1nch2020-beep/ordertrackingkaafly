<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#6b7488;--brand:#5b4bdb;--ok:#16a34a;--line:#e3e7f0}
@media(prefers-color-scheme:dark){:root{--bg:#12151f;--card:#1b2030;--text:#eef1f8;--muted:#98a2b8;--line:#2a3147}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#5b4bdb,#8b5cf6);color:#fff;padding:48px 20px 90px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(24px,5vw,34px)}
header p{margin:0;opacity:.9}
.by{margin:0 0 14px;opacity:.95;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.flag{border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
main{position:relative;z-index:1;max-width:640px;margin:-56px auto 120px;padding:0 16px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.1);margin-bottom:16px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:200px;padding:14px;font-size:17px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--text)}
input:focus{outline:none;border-color:var(--brand)}
button.go{padding:14px 24px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.msg{text-align:center;color:var(--muted);padding:10px}
.hello{font-size:18px;font-weight:600;margin-bottom:4px}
.pkg{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.carrier{display:inline-block;padding:4px 12px;border-radius:99px;background:var(--brand);color:#fff;font-weight:700;font-size:13px}
.id{font-size:22px;font-weight:700;letter-spacing:.5px;margin:10px 0;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--brand);color:var(--brand);background:transparent;text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.btn.fill{background:var(--brand);color:#fff}
.steps{list-style:none;margin:16px 0 0;padding:0}
.steps li{position:relative;padding:0 0 14px 28px;font-size:14px}
.steps li:before{content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.steps li:after{content:"";position:absolute;left:9px;top:16px;bottom:-4px;width:2px;background:var(--line)}
.steps li:last-child:after{display:none}
.steps li.done:before{background:var(--ok)}
.steps li.now:before{background:var(--brand);box-shadow:0 0 0 5px rgba(91,75,219,.25)}
.steps small{display:block;color:var(--muted)}
.info{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.info b{display:block;font-size:12px;color:var(--muted);font-weight:500}
#lang{position:absolute;top:14px;right:14px;padding:8px 10px;border-radius:10px;border:0;font-size:14px;background:rgba(255,255,255,.95);color:#1d2433;cursor:pointer}
header{position:relative}
[dir=rtl] .steps li{padding:0 28px 14px 0}[dir=rtl] .steps li:before{left:auto;right:5px}[dir=rtl] .steps li:after{left:auto;right:9px}
.pkg{position:relative}
.logo{display:inline-flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.cp{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:15px}
.cp:hover{color:var(--brand);border-color:var(--brand)}
[dir=rtl] .cp{right:auto;left:12px}
.trk{position:relative;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.trk .id{margin:10px 0}
.trk .cp{top:0;right:0}
[dir=rtl] .trk .cp{right:auto;left:0}
.pkg .steps{margin-top:6px}
/* chat bubble */
#chat{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:10}
#bubble{width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#6d5df0,#a855f7);display:grid;place-items:center;cursor:pointer;animation:blink 1.4s infinite}
#bubble:hover{transform:scale(1.08)}
#menu svg{width:20px;height:20px;flex:none}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(91,75,219,.7);opacity:1}50%{box-shadow:0 0 0 16px rgba(91,75,219,0);opacity:.7}}
#chat small{font-size:11px;color:var(--muted)}
#menu{display:none;flex-direction:column;gap:8px;margin-bottom:6px}
#menu.open{display:flex}
#menu a{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;color:#fff;text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}.tg{background:#229ed9}.wa{background:#25d366}
</style>
